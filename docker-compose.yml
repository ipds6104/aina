services:
  aina:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
    ports:
      - "${PORT:-8090}:8090"
    env_file:
      - .env
    volumes:
      - aina_data:/app/data
      - aina_workspaces:/app/workspaces
      - aina_gemini:/root/.gemini

volumes:
  aina_data:
    driver: local
  aina_workspaces:
    driver: local
  aina_gemini:
    driver: local
