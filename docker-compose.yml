services:
  aina:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SERVER_PORT:-8090}/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
    ports:
      - "${PORT:-8090}:8090"
    env_file:
      - .env
    volumes:
      - aina_data:/app/data
      - aina_workspaces:/app/workspaces
      - aina_gemini:/root/.gemini

volumes:
  aina_data:
    driver: local
  aina_workspaces:
    driver: local
  aina_gemini:
    driver: local
